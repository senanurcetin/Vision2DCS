name: NEXUS README visual capture

on:
  push:
    branches:
      - docs/nexus-readme-20261017
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.repository == 'senanurcetin/Vision2DCS' && github.ref == 'refs/heads/docs/nexus-readme-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install screenshot-only Playwright (not an application dependency)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local Vite server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/nexus-vision-vite.log 2>&1 &
          echo $! > /tmp/nexus-vision-vite.pid
          node -e 'let n=0;const poll=async()=>{try{const r=await fetch("http://127.0.0.1:4173/");if(r.ok)return process.exit(0)}catch{}if(++n>=90)process.exit(1);setTimeout(poll,1000)};poll()'
      - name: Capture real Chromium desktop/mobile screenshots and update README
        run: node scripts/capture-readme.mjs
      - name: Confirm PNG output is real and substantial
        run: |
          test $(stat -c%s docs/assets/nexus-workspace-desktop.png) -gt 15000
          test $(stat -c%s docs/assets/nexus-workspace-mobile.png) -gt 10000
      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexus-vision2dcs-readme-screenshots
          path: docs/assets/nexus-workspace-*.png
          retention-days: 30
      - name: Commit verified screenshots to this working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/assets/nexus-workspace-*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture real NEXUS Vision2DCS browser screenshots"
            git push origin HEAD:docs/nexus-readme-20261017
          fi
