name: Vision2DCS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Verify all P&ID reference sources and image CRCs
        run: npm run eval:preflight

      - name: Inspect unscored scientific corpus coverage
        run: npm run eval:inspect

      - name: Validate documentation links and headings
        run: npm run docs:check

      - name: Build application
        run: npm run build
