name: Vision2DCS offline Chromium smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'hooks/**'
      - 'components/**'
      - 'services/projectBackup.ts'
      - 'scripts/browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install standalone browser test tool
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start offline local Vite dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/vision2dcs-browser.log 2>&1 &
          node -e 'let n=0;const poll=async()=>{try{const r=await fetch("http://127.0.0.1:4173/");if(r.ok)return process.exit(0)}catch{}if(++n>=90)process.exit(1);setTimeout(poll,1000)};poll()'

      - name: Run engineering review-gate browser smoke
        run: node scripts/browser-smoke.mjs

      - name: Upload responsive screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision2dcs-chromium-smoke
          path: artifacts/browser-smoke/*.png
          if-no-files-found: ignore
          retention-days: 14
