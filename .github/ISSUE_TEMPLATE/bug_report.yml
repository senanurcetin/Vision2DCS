name: Bug report
description: Reproducible Vision2DCS parsing, visualization or export issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use only synthetic or non-confidential P&IDs and scrub logs for keys.
        Report vulnerabilities privately using SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Affected component
      options:
        - P&ID analysis / Gemini server
        - Tag normalization or audit
        - HMI/topology visualization
        - Concept CSV/XML export
        - Build or documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction and observed behavior
      description: Provide minimal steps using one of the public samples, not private drawings
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Verification
      description: Node version; npm test, typecheck, build results if available
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Data and safety
      options:
        - label: I confirm this report contains no API key, private diagram or sensitive plant data.
          required: true
