version: 2.1

# GitHub remains canonical. This checks the same source quality as
# .github/workflows/ci.yml without deploying or using production secrets.
jobs:
  node-quality:
    docker:
      - image: cimg/node:24.13
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - vision2dcs-npm-v1-{{ checksum "package-lock.json" }}
            - vision2dcs-npm-v1-
      - run:
          name: Install locked dependencies
          command: npm ci --no-audit --no-fund
      - save_cache:
          key: vision2dcs-npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Typecheck
          command: npm run typecheck
      - run:
          name: Unit tests
          command: npm test
      - run:
          name: Client and SSR production builds
          command: npm run build

workflows:
  verify:
    jobs:
      - node-quality
